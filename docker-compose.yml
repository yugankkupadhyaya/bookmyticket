version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: bookmyticket-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=mba_db

  postgres:
    image: postgres:16-alpine
    container_name: bookmyticket-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=bookmyticket
      - POSTGRES_PASSWORD=bookmyticket
      - POSTGRES_DB=bookmyticket

  redis:
    image: redis:7-alpine
    container_name: bookmyticket-redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: bookmyticket-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_NAME=mba_db
      - DB_URL=mongodb://mongodb:27017/mba_db
      - DATABASE_URL=postgresql://bookmyticket:bookmyticket@postgres:5432/bookmyticket?schema=public
      - REDIS_URL=redis://redis:6379
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
    depends_on:
      - mongodb
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mongodb_data:
  postgres_data_v2:
