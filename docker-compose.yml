version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: bookmyticket-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=mba_db

  app:
    build: .
    container_name: bookmyticket-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_NAME=mba_db
      - DB_URL=mongodb://mongodb:27017/mba_db
    depends_on:
      - mongodb
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mongodb_data: